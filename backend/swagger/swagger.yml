swagger: "2.0"
info:
  title: Go REST Template API
  description: |
    JSON API for the SaaS starter template: auth (JWT + rotating refresh tokens), TOTP 2FA, WebAuthn passkeys, profile and admin endpoints, and the school cover desk (supply bookings, agency ETAs, reception sign-in log). Errors use the envelope {"error":{"code","message","details"}}. Health check: GET /healthz.
  version: 1.0.0
  contact:
    email: ling@aidraw.ai
  license:
    name: MIT
basePath: /api/v1
paths:
  /admin/audit-logs:
    get:
      tags:
      - admin
      operationId: AdminController.AuditLogs
      parameters:
      - in: query
        name: page
        description: Page (default 1)
        type: integer
        format: int64
      - in: query
        name: per_page
        description: Page size (default 20, max 100)
        type: integer
        format: int64
      - in: query
        name: user_id
        description: Filter by subject user id
        type: string
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.AuditLogPage'
      security:
      - BearerAuth: []
  /admin/stats:
    get:
      tags:
      - admin
      operationId: AdminController.Stats
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.Stats'
        "403":
          description: forbidden
      security:
      - BearerAuth: []
  /admin/users:
    get:
      tags:
      - admin
      operationId: AdminController.ListUsers
      parameters:
      - in: query
        name: page
        description: Page (default 1)
        type: integer
        format: int64
      - in: query
        name: per_page
        description: Page size (default 20, max 100)
        type: integer
        format: int64
      - in: query
        name: q
        description: Search email or name
        type: string
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.UserPage'
      security:
      - BearerAuth: []
  /admin/users/{id}:
    get:
      tags:
      - admin
      operationId: AdminController.GetUser
      parameters:
      - in: path
        name: id
        description: User id
        required: true
        type: string
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.User'
        "404":
          description: not_found
      security:
      - BearerAuth: []
    delete:
      tags:
      - admin
      operationId: AdminController.DeleteUser
      parameters:
      - in: path
        name: id
        description: User id
        required: true
        type: string
      responses:
        "204":
          description: no content
        "403":
          description: 'forbidden: cannot delete self'
      security:
      - BearerAuth: []
    patch:
      tags:
      - admin
      operationId: AdminController.UpdateUser
      parameters:
      - in: path
        name: id
        description: User id
        required: true
        type: string
      - in: body
        name: body
        description: Fields to change
        required: true
        schema:
          $ref: '#/definitions/dto.AdminUpdateUserRequest'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.User'
        "403":
          description: forbidden
      security:
      - BearerAuth: []
  /admin/users/{id}/revoke-sessions:
    post:
      tags:
      - admin
      operationId: AdminController.RevokeSessions
      parameters:
      - in: path
        name: id
        description: User id
        required: true
        type: string
      responses:
        "204":
          description: no content
      security:
      - BearerAuth: []
  /agency/bookings:
    get:
      tags:
      - agency
      operationId: AgencyController.AgencyBookings
      parameters:
      - in: query
        name: date
        description: 'YYYY-MM-DD (default: today in SCHOOL_TIMEZONE)'
        type: string
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.AgencyBookingList'
        "401":
          description: unauthorized
        "429":
          description: rate_limited
      security:
      - AgencyKey: []
  /agency/bookings/{id}/eta:
    post:
      tags:
      - agency
      operationId: AgencyController.AgencyReportETA
      parameters:
      - in: path
        name: id
        description: Booking id
        required: true
        type: string
      - in: body
        name: body
        description: ETA
        required: true
        schema:
          $ref: '#/definitions/dto.EtaRequest'
      responses:
        "201":
          description: ""
          schema:
            $ref: '#/definitions/dto.EtaUpdate'
        "401":
          description: unauthorized
        "404":
          description: 'not_found: unknown booking or another agency''s'
        "409":
          description: 'conflict: not confirmed, not today or already signed in'
        "422":
          description: 'validation_error: ETA outside 06:00-16:00 on the booking date
            or over 10 minutes in the past'
        "429":
          description: 'rate_limited: more than one update per 30s or 100 per booking'
      security:
      - AgencyKey: []
  /auth/forgot-password:
    post:
      tags:
      - auth
      description: |-
        Always returns 202 (no user enumeration).
        <br>
      operationId: AuthController.ForgotPassword
      parameters:
      - in: body
        name: body
        description: Email
        required: true
        schema:
          $ref: '#/definitions/dto.EmailRequest'
      responses:
        "202":
          description: ""
          schema:
            $ref: '#/definitions/dto.Message'
  /auth/google:
    post:
      tags:
      - auth
      description: |-
        Verifies a Google ID token server-side. Creates the account, or links it to an existing account with the same email only when Google is authoritative for that address (gmail.com/googlemail.com, or the token's hosted domain claim equals the email domain); otherwise 409 account_exists_sign_in_required. Returns an AuthResponse, or an MfaChallenge (mfa_required=true) when TOTP is enabled: Google never bypasses 2FA. Disabled (404 google_signin_disabled) unless GOOGLE_CLIENT_IDS is set.
        <br>
      operationId: AuthController.LoginGoogle
      parameters:
      - in: header
        name: X-Session-Transport
        description: 'cookie: set the refresh token as an HttpOnly cookie and omit
          it from the body'
        type: string
      - in: body
        name: body
        description: Google ID token
        required: true
        schema:
          $ref: '#/definitions/dto.GoogleLoginRequest'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "401":
          description: invalid_token
        "403":
          description: account_disabled
        "404":
          description: google_signin_disabled
        "409":
          description: account_exists_sign_in_required
        "429":
          description: rate_limited
  /auth/login:
    post:
      tags:
      - auth
      description: |-
        Returns an AuthResponse, or an MfaChallenge (mfa_required=true) when 2FA is enabled.
        <br>
      operationId: AuthController.Login
      parameters:
      - in: header
        name: X-Session-Transport
        description: 'cookie: set the refresh token as an HttpOnly cookie and omit
          it from the body'
        type: string
      - in: body
        name: body
        description: Credentials
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "401":
          description: invalid_credentials
        "403":
          description: email_not_verified or account_disabled
        "429":
          description: rate_limited
  /auth/login/2fa:
    post:
      tags:
      - auth
      description: |-
        Exchange the mfa_token plus a TOTP or recovery code for a session.
        <br>
      operationId: AuthController.LoginMFA
      parameters:
      - in: header
        name: X-Session-Transport
        description: 'cookie: set the refresh token as an HttpOnly cookie and omit
          it from the body'
        type: string
      - in: body
        name: body
        description: MFA token and code
        required: true
        schema:
          $ref: '#/definitions/dto.MFALoginRequest'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "401":
          description: invalid_mfa_code, invalid_token or token_expired
  /auth/logout:
    post:
      tags:
      - auth
      description: |-
        Idempotent. With X-Session-Transport: cookie the refresh cookie is revoked (when no body token is given) and cleared.
        <br>
      operationId: AuthController.Logout
      parameters:
      - in: header
        name: X-Session-Transport
        description: 'cookie: revoke and clear the HttpOnly refresh cookie'
        type: string
      - in: body
        name: body
        description: Refresh token to revoke (omit when using the cookie)
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      responses:
        "204":
          description: no content
        "403":
          description: 'forbidden: cookie request without X-Session-Transport or from
            a disallowed Origin'
        "422":
          description: 'validation_error: no refresh token in the body or cookie'
  /auth/passkey/login/begin:
    post:
      tags:
      - auth
      description: |-
        Always a discoverable-credential ceremony with user verification required. The optional email is accepted for compatibility and ignored, so the response never depends on whether an account exists.
        <br>
      operationId: AuthController.PasskeyLoginBegin
      parameters:
      - in: body
        name: body
        description: Optional email (ignored)
        schema:
          $ref: '#/definitions/dto.PasskeyLoginBeginRequest'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.CeremonyResponse'
  /auth/passkey/login/finish:
    post:
      tags:
      - auth
      description: |-
        A successful passkey login satisfies MFA.
        <br>
      operationId: AuthController.PasskeyLoginFinish
      parameters:
      - in: header
        name: X-Session-Transport
        description: 'cookie: set the refresh token as an HttpOnly cookie and omit
          it from the body'
        type: string
      - in: body
        name: body
        description: Session and credential
        required: true
        schema:
          $ref: '#/definitions/dto.PasskeyFinishRequest'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "401":
          description: invalid_credentials
  /auth/providers:
    get:
      tags:
      - auth
      description: |-
        Public configuration so clients know whether to show "Continue with Google". web_client_id is not a secret.
        <br>
      operationId: AuthController.Providers
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.ProvidersResponse'
  /auth/refresh:
    post:
      tags:
      - auth
      description: |-
        Rotating refresh; re-using a revoked token revokes the whole token family. Webapp clients send X-Session-Transport: cookie and no body: the token is read from, and the rotated one written to, the HttpOnly refresh cookie (a failed refresh clears it).
        <br>
      operationId: AuthController.Refresh
      parameters:
      - in: header
        name: X-Session-Transport
        description: 'cookie: refresh token travels in the HttpOnly cookie instead
          of the body'
        type: string
      - in: body
        name: body
        description: Refresh token (omit when using the cookie)
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.Tokens'
        "401":
          description: invalid_token or token_expired
        "403":
          description: 'forbidden: cookie request without X-Session-Transport or from
            a disallowed Origin'
        "422":
          description: 'validation_error: no refresh token in the body or cookie'
  /auth/register:
    post:
      tags:
      - auth
      description: |-
        Create a new account and send a verification email. The response is the same whether or not the address is already registered (an existing owner is emailed instead), so it cannot be used to enumerate accounts.
        <br>
      operationId: AuthController.Register
      parameters:
      - in: body
        name: body
        description: Account details
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      responses:
        "202":
          description: ""
          schema:
            $ref: '#/definitions/dto.RegisterResponse'
        "422":
          description: validation_error
        "429":
          description: rate_limited
  /auth/resend-verification:
    post:
      tags:
      - auth
      description: |-
        Always returns 202 to avoid leaking which emails exist.
        <br>
      operationId: AuthController.ResendVerification
      parameters:
      - in: body
        name: body
        description: Email
        required: true
        schema:
          $ref: '#/definitions/dto.EmailRequest'
      responses:
        "202":
          description: ""
          schema:
            $ref: '#/definitions/dto.Message'
  /auth/reset-password:
    post:
      tags:
      - auth
      description: |-
        Sets a new password and revokes all refresh tokens of the user.
        <br>
      operationId: AuthController.ResetPassword
      parameters:
      - in: body
        name: body
        description: Reset token and new password
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordRequest'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.Message'
        "400":
          description: invalid_token
        "422":
          description: validation_error
  /auth/verify-email:
    post:
      tags:
      - auth
      operationId: AuthController.VerifyEmail
      parameters:
      - in: body
        name: body
        description: Verification token from the email link
        required: true
        schema:
          $ref: '#/definitions/dto.TokenRequest'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.Message'
        "400":
          description: invalid_token
  /cover/agencies:
    get:
      tags:
      - cover
      operationId: CoverManagerController.CoverListAgencies
      responses:
        "200":
          description: ""
          schema:
            type: array
            items:
              $ref: '#/definitions/dto.Agency'
        "403":
          description: forbidden
      security:
      - BearerAuth: []
    post:
      tags:
      - cover
      operationId: CoverManagerController.CoverCreateAgency
      parameters:
      - in: body
        name: body
        description: Agency
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAgencyRequest'
      responses:
        "201":
          description: ""
          schema:
            $ref: '#/definitions/dto.AgencyKeyResponse'
        "403":
          description: forbidden
        "409":
          description: 'conflict: name taken'
      security:
      - BearerAuth: []
  /cover/agencies/{id}/rotate-key:
    post:
      tags:
      - cover
      operationId: CoverManagerController.CoverRotateAgencyKey
      parameters:
      - in: path
        name: id
        description: Agency id
        required: true
        type: string
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.AgencyKeyResponse'
        "404":
          description: not_found
      security:
      - BearerAuth: []
  /cover/bookings:
    post:
      tags:
      - cover
      operationId: CoverManagerController.CoverCreateBooking
      parameters:
      - in: body
        name: body
        description: Booking with one lesson per period of its kind
        required: true
        schema:
          $ref: '#/definitions/dto.CreateBookingRequest'
      responses:
        "201":
          description: ""
          schema:
            $ref: '#/definitions/dto.Booking'
        "403":
          description: forbidden
        "422":
          description: validation_error
      security:
      - BearerAuth: []
  /cover/bookings/{id}:
    patch:
      tags:
      - cover
      operationId: CoverManagerController.CoverUpdateBooking
      parameters:
      - in: path
        name: id
        description: Booking id
        required: true
        type: string
      - in: body
        name: body
        description: Changes
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateBookingRequest'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.Booking'
        "404":
          description: not_found
        "409":
          description: 'conflict: cancelled, signed in, or changed meanwhile'
        "422":
          description: 'validation_error: e.g. teacher of another agency'
      security:
      - BearerAuth: []
  /cover/bookings/{id}/sign-in:
    post:
      tags:
      - cover
      operationId: CoverDeskController.CoverSignIn
      parameters:
      - in: path
        name: id
        description: Booking id
        required: true
        type: string
      - in: body
        name: body
        description: Checks made
        required: true
        schema:
          $ref: '#/definitions/dto.SignInRequest'
      responses:
        "201":
          description: ""
          schema:
            $ref: '#/definitions/dto.SignInEvent'
        "404":
          description: not_found
        "409":
          description: 'conflict: not confirmed, not today or already signed in'
        "422":
          description: 'validation_error: photo ID not checked, or DBS certificate
            required'
      security:
      - BearerAuth: []
  /cover/sign-ins:
    get:
      tags:
      - cover
      operationId: CoverDeskController.CoverSignInLog
      parameters:
      - in: query
        name: date
        description: 'YYYY-MM-DD booking date (default: today in SCHOOL_TIMEZONE)'
        type: string
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.SignInLog'
        "422":
          description: validation_error
      security:
      - BearerAuth: []
  /cover/sign-ins/{id}/corrections:
    post:
      tags:
      - cover
      operationId: CoverDeskController.CoverSignInCorrection
      parameters:
      - in: path
        name: id
        description: Sign-in event id
        required: true
        type: string
      - in: body
        name: body
        description: Reason
        required: true
        schema:
          $ref: '#/definitions/dto.CorrectionRequest'
      responses:
        "201":
          description: ""
          schema:
            $ref: '#/definitions/dto.SignInEvent'
        "404":
          description: not_found
        "409":
          description: 'conflict: already withdrawn'
      security:
      - BearerAuth: []
  /cover/teachers:
    get:
      tags:
      - cover
      operationId: CoverManagerController.CoverListTeachers
      parameters:
      - in: query
        name: agency_id
        description: Only this agency's teachers
        type: string
      responses:
        "200":
          description: ""
          schema:
            type: array
            items:
              $ref: '#/definitions/dto.SupplyTeacher'
      security:
      - BearerAuth: []
    post:
      tags:
      - cover
      operationId: CoverManagerController.CoverCreateTeacher
      parameters:
      - in: body
        name: body
        description: Teacher
        required: true
        schema:
          $ref: '#/definitions/dto.CreateTeacherRequest'
      responses:
        "201":
          description: ""
          schema:
            $ref: '#/definitions/dto.SupplyTeacher'
        "422":
          description: validation_error
      security:
      - BearerAuth: []
  /cover/today:
    get:
      tags:
      - cover
      description: |-
        Reception receives dto.CoverTodayReception (no covering, subject, lessons, notes or attention items); cover managers and admins receive dto.CoverTodayManager.
        <br>
      operationId: CoverDeskController.CoverToday
      parameters:
      - in: query
        name: date
        description: 'YYYY-MM-DD (default: today in SCHOOL_TIMEZONE)'
        type: string
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.CoverTodayManager'
        "403":
          description: forbidden
        "422":
          description: validation_error
      security:
      - BearerAuth: []
  /cover/week:
    get:
      tags:
      - cover
      description: |-
        Reception receives dto.CoverWeekReception (name, agency, kind, status); cover managers and admins receive dto.CoverWeekManager.
        <br>
      operationId: CoverDeskController.CoverWeek
      parameters:
      - in: query
        name: start
        description: 'Monday, YYYY-MM-DD (default: this week)'
        type: string
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.CoverWeekManager'
        "403":
          description: forbidden
        "422":
          description: validation_error
      security:
      - BearerAuth: []
  /me/:
    get:
      tags:
      - me
      operationId: MeController.Profile
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.User'
        "401":
          description: unauthorized
      security:
      - BearerAuth: []
    patch:
      tags:
      - me
      operationId: MeController.UpdateProfile
      parameters:
      - in: body
        name: body
        description: New name
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProfileRequest'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.User'
      security:
      - BearerAuth: []
  /me/2fa/recovery-codes:
    post:
      tags:
      - me
      operationId: MeController.RegenerateRecoveryCodes
      parameters:
      - in: body
        name: body
        description: TOTP or recovery code
        required: true
        schema:
          $ref: '#/definitions/dto.CodeRequest'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.RecoveryCodesResponse'
      security:
      - BearerAuth: []
  /me/2fa/totp/disable:
    post:
      tags:
      - me
      operationId: MeController.TOTPDisable
      parameters:
      - in: body
        name: body
        description: Password (omit for password-less accounts) and TOTP/recovery
          code
        required: true
        schema:
          $ref: '#/definitions/dto.DisableTOTPRequest'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.Message'
      security:
      - BearerAuth: []
  /me/2fa/totp/enable:
    post:
      tags:
      - me
      operationId: MeController.TOTPEnable
      parameters:
      - in: body
        name: body
        description: Current TOTP code
        required: true
        schema:
          $ref: '#/definitions/dto.CodeRequest'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.RecoveryCodesResponse'
        "401":
          description: invalid_mfa_code
      security:
      - BearerAuth: []
  /me/2fa/totp/setup:
    post:
      tags:
      - me
      description: |-
        Requires a recent sign-in (REAUTH_MAX_AGE, default 10 min), otherwise 403 reauthentication_required.
        <br>
      operationId: MeController.TOTPSetup
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.TOTPSetupResponse'
        "403":
          description: reauthentication_required
      security:
      - BearerAuth: []
  /me/change-password:
    post:
      tags:
      - me
      operationId: MeController.ChangePassword
      parameters:
      - in: body
        name: body
        description: Current and new password
        required: true
        schema:
          $ref: '#/definitions/dto.ChangePasswordRequest'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.Message'
        "401":
          description: invalid_credentials
      security:
      - BearerAuth: []
  /me/passkeys:
    get:
      tags:
      - me
      operationId: MeController.ListPasskeys
      responses:
        "200":
          description: ""
          schema:
            type: array
            items:
              $ref: '#/definitions/dto.Passkey'
      security:
      - BearerAuth: []
  /me/passkeys/{id}:
    delete:
      tags:
      - me
      operationId: MeController.DeletePasskey
      parameters:
      - in: path
        name: id
        description: Passkey id
        required: true
        type: string
      responses:
        "204":
          description: no content
        "404":
          description: not_found
      security:
      - BearerAuth: []
  /me/passkeys/register/begin:
    post:
      tags:
      - me
      description: |-
        Requires a recent sign-in (REAUTH_MAX_AGE, default 10 min), otherwise 403 reauthentication_required.
        <br>
      operationId: MeController.PasskeyRegisterBegin
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/dto.CeremonyResponse'
        "403":
          description: reauthentication_required
      security:
      - BearerAuth: []
  /me/passkeys/register/finish:
    post:
      tags:
      - me
      operationId: MeController.PasskeyRegisterFinish
      parameters:
      - in: body
        name: body
        description: Session, name and credential
        required: true
        schema:
          $ref: '#/definitions/dto.PasskeyRegisterFinishRequest'
      responses:
        "201":
          description: ""
          schema:
            $ref: '#/definitions/dto.Passkey'
      security:
      - BearerAuth: []
definitions:
  dto.AdminUpdateUserRequest:
    title: AdminUpdateUserRequest
    type: object
    properties:
      email_verified:
        type: boolean
      is_active:
        type: boolean
      name:
        type: string
      role:
        description: user, admin, reception or cover_manager
        type: string
  dto.Agency:
    title: Agency
    type: object
    properties:
      created_at:
        description: RFC3339 UTC
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
        example: Kestrel Teaching
      phone:
        type: string
        example: 01632 960 214
  dto.AgencyBooking:
    title: AgencyBooking
    type: object
    properties:
      date:
        type: string
      expected_arrival:
        description: RFC3339 UTC
        type: string
      id:
        type: string
      kind:
        type: string
      status:
        type: string
      teacher_name:
        type: string
  dto.AgencyBookingList:
    title: AgencyBookingList
    type: object
    properties:
      date:
        type: string
      items:
        type: array
        items:
          $ref: '#/definitions/dto.AgencyBooking'
  dto.AgencyKeyResponse:
    title: AgencyKeyResponse
    type: object
    properties:
      api_key:
        description: Plaintext agency API key (send as X-Agency-Key). Shown only once;
          only its SHA-256 hash is stored
        type: string
      created_at:
        description: RFC3339 UTC
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
        example: Kestrel Teaching
      phone:
        type: string
        example: 01632 960 214
  dto.AuditLog:
    title: AuditLog
    type: object
    properties:
      action:
        type: string
        example: login.success
      actor_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      ip:
        type: string
      metadata:
        additionalProperties:
          type: string
      user_agent:
        type: string
      user_id:
        type: string
  dto.AuditLogPage:
    title: AuditLogPage
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/dto.AuditLog'
      page:
        type: integer
        format: int64
      per_page:
        type: integer
        format: int64
      total:
        type: integer
        format: int64
  dto.AuthResponse:
    title: AuthResponse
    type: object
    properties:
      mfa_required:
        type: boolean
        example: false
      tokens:
        $ref: '#/definitions/dto.Tokens'
      user:
        $ref: '#/definitions/dto.User'
  dto.Booking:
    title: Booking
    type: object
    properties:
      agency_id:
        type: string
      covering:
        description: absent member of staff
        type: string
        example: Mr Okafor
      created_at:
        type: string
      date:
        description: YYYY-MM-DD school-local
        type: string
        example: "2026-11-23"
      expected_arrival:
        description: RFC3339 UTC
        type: string
      id:
        type: string
      kind:
        description: full, am or pm
        type: string
        example: full
      lanyard:
        type: string
        example: S-01
      lessons:
        type: array
        items:
          $ref: '#/definitions/dto.Lesson'
      status:
        description: requested, confirmed or cancelled
        type: string
        example: requested
      subject:
        type: string
        example: Science
      supply_teacher_id:
        description: null until confirmed
        type: string
      updated_at:
        type: string
  dto.CeremonyResponse:
    title: CeremonyResponse
    type: object
    properties:
      session_id:
        type: string
  dto.ChangePasswordRequest:
    title: ChangePasswordRequest
    required:
    - current_password
    - new_password
    type: object
    properties:
      current_password:
        type: string
      new_password:
        type: string
  dto.CodeRequest:
    title: CodeRequest
    required:
    - code
    type: object
    properties:
      code:
        type: string
  dto.CorrectionRequest:
    title: CorrectionRequest
    required:
    - reason
    type: object
    properties:
      reason:
        description: wrong_person, not_on_site or checks_incomplete
        type: string
  dto.CoverArrival:
    title: CoverArrival
    type: object
    properties:
      agency_name:
        type: string
      agency_phone:
        type: string
      booking_id:
        type: string
      dbs_certificate_required:
        description: reception must see a DBS certificate at sign-in
        type: boolean
      eta:
        description: latest agency ETA, RFC3339 UTC, or null
        type: string
      eta_stale:
        description: no ETA update for over 20 minutes while travelling
        type: boolean
      eta_updated_at:
        description: when the latest ETA was received (server time), or null
        type: string
      expected_arrival:
        description: RFC3339 UTC
        type: string
      lanyard:
        type: string
      status:
        description: signed_in, unconfirmed, no_eta, on_the_way or running_late
        type: string
        example: on_the_way
      teacher_name:
        description: empty until the booking is confirmed
        type: string
  dto.CoverAttention:
    title: CoverAttention
    type: object
    properties:
      booking_id:
        type: string
      detail:
        type: string
      message:
        type: string
        example: P1 Science needs cover until 09:07
      severity:
        description: bad or warn
        type: string
        example: warn
      type:
        description: unconfirmed, cover_gap or eta_stale
        type: string
        example: cover_gap
  dto.CoverManagerArrival:
    title: CoverManagerArrival
    type: object
    properties:
      agency_name:
        type: string
      agency_phone:
        type: string
      booking_id:
        type: string
      covering:
        type: string
      dbs_certificate_required:
        description: reception must see a DBS certificate at sign-in
        type: boolean
      dbs_confirmed:
        type: boolean
      eta:
        description: latest agency ETA, RFC3339 UTC, or null
        type: string
      eta_stale:
        description: no ETA update for over 20 minutes while travelling
        type: boolean
      eta_updated_at:
        description: when the latest ETA was received (server time), or null
        type: string
      expected_arrival:
        description: RFC3339 UTC
        type: string
      first_lesson:
        $ref: '#/definitions/dto.FirstLesson'
      kind:
        type: string
      lanyard:
        type: string
      note:
        description: latest agency note
        type: string
      status:
        description: signed_in, unconfirmed, no_eta, on_the_way or running_late
        type: string
        example: on_the_way
      subject:
        type: string
      teacher_name:
        description: empty until the booking is confirmed
        type: string
  dto.CoverTodayManager:
    title: CoverTodayManager
    type: object
    properties:
      arrivals:
        type: array
        items:
          $ref: '#/definitions/dto.CoverManagerArrival'
      attention:
        type: array
        items:
          $ref: '#/definitions/dto.CoverAttention'
      counts:
        description: arrivals per status
        additionalProperties:
          type: integer
          format: int64
      date:
        type: string
        example: "2026-11-23"
      timezone:
        type: string
        example: Europe/London
  dto.CoverWeekCell:
    title: CoverWeekCell
    type: object
    properties:
      booking_id:
        type: string
      kind:
        type: string
      status:
        description: requested, confirmed or cancelled
        type: string
  dto.CoverWeekManager:
    title: CoverWeekManager
    type: object
    properties:
      rows:
        type: array
        items:
          $ref: '#/definitions/dto.CoverWeekManagerRow'
      start:
        description: Monday, YYYY-MM-DD
        type: string
  dto.CoverWeekManagerCell:
    title: CoverWeekManagerCell
    type: object
    properties:
      booking_id:
        type: string
      covering:
        type: string
      kind:
        type: string
      lessons:
        type: array
        items:
          $ref: '#/definitions/dto.Lesson'
      status:
        description: requested, confirmed or cancelled
        type: string
  dto.CoverWeekManagerDay:
    title: CoverWeekManagerDay
    type: object
    properties:
      bookings:
        type: array
        items:
          $ref: '#/definitions/dto.CoverWeekManagerCell'
      date:
        type: string
  dto.CoverWeekManagerRow:
    title: CoverWeekManagerRow
    type: object
    properties:
      agency_name:
        type: string
      days:
        description: Monday to Friday
        type: array
        items:
          $ref: '#/definitions/dto.CoverWeekManagerDay'
      teacher_name:
        type: string
  dto.CreateAgencyRequest:
    title: CreateAgencyRequest
    required:
    - name
    - phone
    type: object
    properties:
      name:
        type: string
      phone:
        type: string
  dto.CreateBookingRequest:
    title: CreateBookingRequest
    required:
    - agency_id
    - date
    - kind
    - covering
    - subject
    - expected_arrival
    - lessons
    type: object
    properties:
      agency_id:
        type: string
      covering:
        description: absent member of staff
        type: string
      date:
        description: YYYY-MM-DD school-local
        type: string
      expected_arrival:
        description: HH:MM school-local on the booking date
        type: string
        example: "08:15"
      kind:
        description: full (P1-P5), am (P1-P3) or pm (P4-P5)
        type: string
      lanyard:
        description: short visitor lanyard label
        type: string
      lessons:
        description: each period of the kind exactly once
        type: array
        items:
          $ref: '#/definitions/dto.LessonInput'
      subject:
        type: string
  dto.CreateTeacherRequest:
    title: CreateTeacherRequest
    required:
    - agency_id
    - name
    type: object
    properties:
      agency_id:
        type: string
      dbs_confirmed:
        description: the agency attests an enhanced DBS check
        type: boolean
      name:
        type: string
      subject:
        type: string
  dto.DisableTOTPRequest:
    title: DisableTOTPRequest
    required:
    - code
    type: object
    properties:
      code:
        type: string
      password:
        description: required unless the account has no password (has_password=false)
        type: string
  dto.EmailRequest:
    title: EmailRequest
    required:
    - email
    type: object
    properties:
      email:
        type: string
  dto.EtaRequest:
    title: EtaRequest
    required:
    - eta
    type: object
    properties:
      eta:
        description: HH:MM (school-local, booking date) or RFC3339
        type: string
        example: "08:12"
      note:
        description: at most 120 characters; control characters are removed
        type: string
  dto.EtaUpdate:
    title: EtaUpdate
    type: object
    properties:
      booking_id:
        type: string
      eta:
        description: RFC3339 UTC
        type: string
      id:
        type: string
      note:
        type: string
      reported_at:
        description: server receive time, RFC3339 UTC
        type: string
  dto.FirstLesson:
    title: FirstLesson
    type: object
    properties:
      class_name:
        type: string
      period:
        type: string
        example: P1
      room:
        type: string
      start:
        description: HH:MM school-local
        type: string
        example: "08:55"
  dto.GoogleLoginRequest:
    title: GoogleLoginRequest
    required:
    - id_token
    type: object
    properties:
      id_token:
        description: Google ID token (JWT)
        type: string
  dto.GoogleProvider:
    title: GoogleProvider
    type: object
    properties:
      enabled:
        type: boolean
      web_client_id:
        description: public OAuth web client id; empty when disabled
        type: string
  dto.Lesson:
    title: Lesson
    type: object
    properties:
      class_name:
        type: string
        example: 9X2
      end:
        description: HH:MM school-local
        type: string
        example: "09:55"
      free:
        description: booked time with no lesson
        type: boolean
      period:
        type: string
        example: P1
      room:
        type: string
        example: Lab 2
      start:
        description: HH:MM school-local
        type: string
        example: "08:55"
  dto.LessonInput:
    title: LessonInput
    required:
    - period
    type: object
    properties:
      class_name:
        description: required unless free
        type: string
      free:
        description: booked time with no lesson
        type: boolean
      period:
        type: string
        example: P1
      room:
        description: required unless free
        type: string
  dto.LoginRequest:
    title: LoginRequest
    required:
    - email
    - password
    type: object
    properties:
      email:
        type: string
      password:
        type: string
  dto.MFALoginRequest:
    title: MFALoginRequest
    required:
    - mfa_token
    - code
    type: object
    properties:
      code:
        description: 6-digit TOTP code or a recovery code
        type: string
      mfa_token:
        type: string
  dto.Message:
    title: Message
    type: object
    properties:
      message:
        type: string
  dto.Passkey:
    title: Passkey
    type: object
    properties:
      created_at:
        type: string
      id:
        type: string
      last_used_at:
        description: RFC3339 or null
        type: string
      name:
        type: string
        example: MacBook
  dto.PasskeyFinishRequest:
    title: PasskeyFinishRequest
    required:
    - session_id
    type: object
    properties:
      session_id:
        type: string
  dto.PasskeyLoginBeginRequest:
    title: PasskeyLoginBeginRequest
    type: object
    properties:
      email:
        description: omit for discoverable credential login
        type: string
  dto.PasskeyRegisterFinishRequest:
    title: PasskeyRegisterFinishRequest
    required:
    - session_id
    type: object
    properties:
      name:
        type: string
        example: MacBook
      session_id:
        type: string
  dto.ProvidersResponse:
    title: ProvidersResponse
    type: object
    properties:
      google:
        $ref: '#/definitions/dto.GoogleProvider'
  dto.RecoveryCodesResponse:
    title: RecoveryCodesResponse
    type: object
    properties:
      recovery_codes:
        type: array
        items:
          type: string
  dto.RefreshRequest:
    title: RefreshRequest
    type: object
    properties:
      refresh_token:
        description: 'Required unless the refresh cookie is sent (X-Session-Transport:
          cookie)'
        type: string
  dto.RegisterRequest:
    title: RegisterRequest
    required:
    - email
    - password
    - name
    type: object
    properties:
      email:
        type: string
        example: ada@example.com
      name:
        type: string
      password:
        description: 8-128 chars
        type: string
  dto.RegisterResponse:
    title: RegisterResponse
    type: object
    properties:
      message:
        type: string
        example: Check your email to finish setting up your account.
  dto.ResetPasswordRequest:
    title: ResetPasswordRequest
    required:
    - token
    - password
    type: object
    properties:
      password:
        type: string
      token:
        type: string
  dto.SignInEvent:
    title: SignInEvent
    type: object
    properties:
      actor_user_id:
        type: string
      at:
        description: RFC3339 UTC, server time
        type: string
      booking_id:
        type: string
      dbs_evidence:
        description: agency_confirmation or certificate_seen
        type: string
      id:
        type: string
      lanyard:
        type: string
      photo_id_checked:
        type: boolean
      reason:
        description: 'correction: wrong_person, not_on_site or checks_incomplete'
        type: string
      ref_id:
        description: 'correction: the sign-in it withdraws'
        type: string
      supply_teacher_id:
        description: the teacher signed in, as recorded when the event was appended
        type: string
      teacher_name:
        description: as recorded when the event was appended; later reassignments
          do not change it
        type: string
      type:
        description: signin or correction
        type: string
  dto.SignInLog:
    title: SignInLog
    type: object
    properties:
      date:
        type: string
      items:
        description: newest first
        type: array
        items:
          $ref: '#/definitions/dto.SignInEvent'
  dto.SignInRequest:
    title: SignInRequest
    required:
    - photo_id_checked
    type: object
    properties:
      dbs_certificate_seen:
        description: required when the agency has not confirmed a DBS check
        type: boolean
      photo_id_checked:
        description: must be true
        type: boolean
  dto.Stats:
    title: Stats
    type: object
    properties:
      users_2fa:
        type: integer
        format: int64
      users_active:
        type: integer
        format: int64
      users_total:
        type: integer
        format: int64
      users_verified:
        type: integer
        format: int64
  dto.SupplyTeacher:
    title: SupplyTeacher
    type: object
    properties:
      agency_id:
        type: string
      created_at:
        description: RFC3339 UTC
        type: string
      dbs_confirmed:
        description: the agency attests an enhanced DBS check
        type: boolean
      id:
        type: string
      name:
        type: string
        example: Priya Natarajan
      subject:
        type: string
        example: Science
  dto.TOTPSetupResponse:
    title: TOTPSetupResponse
    type: object
    properties:
      otpauth_url:
        type: string
      secret:
        type: string
  dto.TokenRequest:
    title: TokenRequest
    required:
    - token
    type: object
    properties:
      token:
        type: string
  dto.Tokens:
    title: Tokens
    type: object
    properties:
      access_token:
        description: HS256 JWT
        type: string
      expires_in:
        description: Access token lifetime in seconds
        type: integer
        example: 900
        format: int64
      refresh_token:
        description: 'Opaque rotating refresh token; omitted (sent as an HttpOnly
          cookie) when the request has X-Session-Transport: cookie'
        type: string
      token_type:
        type: string
        example: Bearer
  dto.UpdateBookingRequest:
    title: UpdateBookingRequest
    type: object
    properties:
      covering:
        type: string
      lanyard:
        type: string
      lessons:
        description: replaces all lessons
        type: array
        items:
          $ref: '#/definitions/dto.LessonInput'
      status:
        description: confirmed (needs supply_teacher_id) or cancelled
        type: string
      supply_teacher_id:
        description: teacher of the booking's agency; only with status=confirmed
        type: string
  dto.UpdateProfileRequest:
    title: UpdateProfileRequest
    required:
    - name
    type: object
    properties:
      name:
        type: string
  dto.User:
    title: User
    type: object
    properties:
      created_at:
        description: RFC3339 UTC
        type: string
        example: "2026-01-01T12:00:00Z"
      email:
        type: string
        example: ada@example.com
      email_verified:
        type: boolean
      has_password:
        description: false for accounts created via an identity provider until a password
          is set
        type: boolean
      id:
        description: User UUID
        type: string
        example: 6f1c1a0e-5a0e-4a3e-9f7a-3b1d2f6b7c11
      identities:
        description: linked identity providers, e.g. ["google"]
        type: array
        items:
          type: string
      is_active:
        type: boolean
      name:
        type: string
        example: Ada
      passkey_count:
        type: integer
        format: int64
      role:
        description: user, admin, reception or cover_manager
        type: string
        example: user
      totp_enabled:
        type: boolean
      updated_at:
        description: RFC3339 UTC
        type: string
        example: "2026-01-01T12:00:00Z"
  dto.UserPage:
    title: UserPage
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/dto.User'
      page:
        type: integer
        format: int64
      per_page:
        type: integer
        format: int64
      total:
        type: integer
        format: int64
  dto.interface:
    title: interface
    type: object
securityDefinitions:
  AgencyKey:
    type: apiKey
    description: Supply agency API key (cover desk)
    name: X-Agency-Key
    in: header
  BearerAuth:
    type: apiKey
    description: 'Enter: Bearer <access_token>'
    name: Authorization
    in: header
tags:
- name: auth
  description: |
    AuthController handles public authentication endpoints.
- name: me
  description: |
    MeController handles the authenticated user's own account.
- name: admin
  description: |
    AdminController handles admin-only endpoints (role=admin enforced by filters).
- name: cover
  description: |
    CoverManagerController handles agencies, supply teachers and bookings (cover managers and admins).
- name: agency
  description: |
    AgencyController is the API for supply agencies (X-Agency-Key enforced by filters.AuthenticateAgency).
