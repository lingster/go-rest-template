name: Android internal (Play)

# A published GitHub release (pre-releases too) -> signed App Bundle -> Google
# Play internal testing track. Version = the tag (v1.2.3 -> 1.2.3); version
# code = above everything on Play and >= GITHUB_RUN_NUMBER
# (tool/fastlane/build_info.rb). See docs/RELEASING.md.
# Skips with a notice until the Play secrets exist (docs/STORES.md).
# Runner: ubuntu-latest, or the ANDROID_RUNNER repo variable, e.g.
#   ["self-hosted","Linux","android"]
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)build, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

# Queue rather than cancel: an upload in progress always finishes.
concurrency:
  group: android-internal
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/store-gate.yml
    with:
      store: Google Play
      required: PLAY_SERVICE_ACCOUNT_JSON ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
    secrets: inherit

  checks:
    needs: gate
    if: needs.gate.outputs.configured == 'true'
    uses: ./.github/workflows/flutter-checks.yml
    with:
      ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}

  play:
    name: Play internal
    needs: [gate, checks]
    if: needs.gate.outputs.configured == 'true'
    runs-on: ${{ fromJSON(vars.ANDROID_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
      - uses: ./.github/actions/release-tag
        with:
          tag: ${{ inputs.tag }}
      - uses: ./.github/actions/setup-android
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/setup-fastlane
      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "APP_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build and upload
        working-directory: flutter_app/android
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Optional repo variable: "draft" while the Play app is still a draft
          # app (docs/STORES.md); unset -> completed.
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS }}
          # Store-build dart-defines (docs/STORES.md).
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: bundle exec fastlane internal
      - if: always()
        name: Remove keystore
        run: rm -f "$RUNNER_TEMP/upload.jks"
