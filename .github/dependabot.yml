version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: pub
    directory: /flutter_app
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /webapp
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Base images in backend/Dockerfile and docker-compose.yml are pinned by digest; keep them current.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
