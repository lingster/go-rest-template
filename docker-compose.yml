services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  api:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      APP_ENV: dev
      HTTP_PORT: "8080"
      DB_DRIVER: postgres
      DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me-please-0123456789}
      MAIL_DRIVER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: "App <no-reply@example.com>"
      FRONTEND_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_ORIGINS: http://localhost:5173
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-please}

volumes:
  pgdata:
